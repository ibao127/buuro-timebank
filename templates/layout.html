    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title><span class="notranslate">Buuro</span></title>
        <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Fredoka+One&family=Pacifico&family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
        <script src="{{ url_for('static', filename='js/translate.js') }}"></script>
        <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    </head>
    <body>
        <div class="bg-wave {% block no_wave %}{% endblock %}"></div>
        <nav>
            <a href="{{ url_for('home') }}" class="nav-logo">
                <img src="{{ url_for('static', filename='images/icons/home-icon.svg') }}" alt="home">
                <span class="nav-brand">
                    <img src="{{ url_for('static', filename='images/buuro-logo.svg') }}" alt="Buuro">
                </span>
            </a>

            <div class="nav-links">
                <a href="{{ url_for('about') }}">About</a>
                <a href="{{ url_for('events') }}">Events</a>
                <a href="{{ url_for('requests_page') }}">Requests</a>
            </div>

            <div class="nav-right">
                <div class="dropdown">
                    <button aria-label="Language">
                        <img src="{{ url_for('static', filename='images/icons/globe-icon.svg') }}" alt="language">
                    </button>
                    <div class="dropdown-menu">
                        <a href="#" onclick="triggerTranslate('nl'); return false;">Nederlands</a>
                        <a href="#" onclick="triggerTranslate('en'); return false;">English</a>
                    </div>
                </div>
                <div class="dropdown">
                    <button aria-label="Account">
                        <img src="{{ url_for('static', filename='images/icons/user-icon.svg') }}" alt="account">
                    </button>
                    <div class="dropdown-menu">
                        <a href="{{ url_for('account') }}">Account</a>
                        <a href="{{ url_for('login') }}">Log in</a>
                        <a href="{{ url_for('signup') }}">Sign up</a>
                    </div>
                </div>
                <div class="nav-sidebar-wrap">
                    <button aria-label="Menu" class="nav-sidebar-toggle" onclick="toggleSidebar()">
                        <img src="{{ url_for('static', filename='images/icons/settings_account.svg') }}" alt="menu">
                    </button>
                    <div class="nav-sidebar" id="sidebar">
                        <a href="{{ url_for('home') }}">Home</a>
                        <a href="{{ url_for('about') }}">About</a>
                        <a href="{{ url_for('events') }}">Events</a>
                        <a href="{{ url_for('requests_page') }}">Requests</a>
                        <a href="{{ url_for('faq') }}">FAQ</a>
                        <div class="sidebar-dropdown">
                            <span onclick="toggleSidebarDropdown(this)">Account ↓</span>
                            <div class="sidebar-dropdown-menu">
                                <a href="{{ url_for('account') }}">My Account</a>
                                <a href="{{ url_for('wallet') }}">Wallet</a>
                                <a href="{{ url_for('login') }}">Log in</a>
                                <a href="{{ url_for('signup') }}">Sign up</a>
                                <a href="{{ url_for('home') }}">Log out</a>
                            </div>
                        </div>
                        <div class="sidebar-dropdown">
                            <span onclick="toggleSidebarDropdown(this)">Language ↓</span>
                            <div class="sidebar-dropdown-menu">
                                <a href="#" onclick="triggerTranslate('nl'); return false;">Nederlands</a>
                                <a href="#" onclick="triggerTranslate('en'); return false;">English</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
        <main>
            {% block content %}{% endblock %}
        </main>
        <footer>
            <div class="footer-col">
                <span class="footer-heading">Contact us</span>
                <a href="mailto:hallo@buuro.net">hallo@buuro.net</a>
            </div>
            <div class="footer-col center">
                <a href="{{ url_for('faq') }}">FAQ</a>
                <a href="{{ url_for('report') }}">Report an issue</a>
            </div>
            <div class="footer-col right">
                <img src="{{ url_for('static', filename='images/buuro-logo.svg') }}" alt="Buuro">
            </div>
        </footer>
        <script src="{{ url_for('static', filename='js/slideshow.js') }}"></script>
        <script src="{{ url_for('static', filename='js/sidebar.js') }}"></script>
        <script src="{{ url_for('static', filename='js/faq.js') }}"></script>
        <div id="google_translate_element" style="display:none"></div>
    </body>
    </html>
